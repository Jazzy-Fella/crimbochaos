<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crimbo Panic intro preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; height: min(100vh, 177.78vw); aspect-ratio: 9 / 16; cursor: pointer; }
</style>
</head>
<body>
<!-- Preview of the intro movie on its own. Tap to jump to the next scene (the first tap
     also turns the sound on); it loops. -->
<canvas id="c" width="144" height="256"></canvas>
<script src="intro.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
// Sound: same little synth as the game; starts on the first tap (browsers require it)
let ac = null, buf = null;
function tone({ type = 'square', f0, f1, dur, vol = 0.08, delay = 0 }) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise({ dur, vol = 0.1, f = 1000, f1, type = 'lowpass', delay = 0 }) {
  if (!ac) return;
  if (!buf) { buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime + delay, src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; src.loop = true; flt.type = type; flt.frequency.setValueAtTime(f, t);
  if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt).connect(g).connect(ac.destination); src.start(t); src.stop(t + dur + 0.05);
}
const startSound = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ac && ac.state === 'suspended') ac.resume(); };
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, startSound));

const newIntro = () => CrimboIntro.create(ctx, { tone, noise });
let intro = newIntro(), wait = 0;
addEventListener('pointerdown', () => { startSound(); intro.done ? (intro = newIntro()) : intro.next(); });
const STEP = 1000 / 60; let last = performance.now(), acc = 0;
(function loop(now) {
  acc = Math.min(acc + (now - last), 200); last = now;
  while (acc >= STEP) {
    acc -= STEP;
    if (intro.done) { if (++wait > 90) { intro = newIntro(); wait = 0; } }
    else intro.update();
  }
  if (intro.done) { ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, 144, 256); }
  else intro.draw(144, 256, 'TAP: NEXT SCENE');
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
