     that starts under the clock but stops a status bar short of the bottom of the screen -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
  html, body {
    margin: 0; height: 100%; background: #0b1026; overflow: hidden;
    /* phones: no scrolling, pinch/double-tap zoom, pull-to-refresh, text selection or tap flashes */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); } /* notch / home bar sizes, read by the game */
  body {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    /* pinned to the edges of the window the phone gives us (rather than sized with 100vh,
       which mobile browsers measure inconsistently) */
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    /* the game runs edge to edge, under the notch and home bar; only keep clear of the
       side notch when a phone is turned sideways */
    padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    height: min(100%, 177.78vw);     /* fill the height, or the width on very narrow screens (9:16) */
    aspect-ratio: 9 / 16;
    touch-action: none;
    cursor: pointer;
  }
  /* phones held upright: stretch to every edge (the game is sized to match the screen
     shape, so this is never visibly stretched) */
  canvas.fill { width: 100%; height: 100%; aspect-ratio: auto; }
</style>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const W = cv.width;
let H = cv.height;
let OY = 0; // on tall screens the 256px-high game is shifted down by this much to sit centred

// game grows taller to fill them (up to 320px; the extra space is at the bottom, where
// the chimneys and snow just reach further down). Desktop/landscape stays 144x256.

// bottom. So when running as a home screen app, size the page from the real screen.

    matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;

function fitScreen() {
  const b = document.body;

  const ratio = b.clientHeight / Math.max(1, b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const tall = ratio > 256 / W + 0.01;               // taller than 9:16, e.g. any phone held upright
  const newH = Math.max(256, Math.min(400, Math.round(W * ratio)));
  if (newH !== H) { H = newH; cv.height = H; ctx.imageSmoothingEnabled = false; }
  OY = Math.floor((H - 256) / 2);
  cv.classList.toggle('fill', tall);
  cv.style.aspectRatio = tall ? '' : `${W} / ${H}`;
  cv.style.height = tall ? '' : `min(100%, ${(H / W * 100).toFixed(2)}vw)`;
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;

// Phones report their final size late (rotating, browser bars sliding, home screen apps

addEventListener('pageshow', fitScreen);
if (window.visualViewport) visualViewport.addEventListener('resize', fitScreen);
[100, 500, 1500].forEach(ms => setTimeout(fitScreen, ms));
const GROUND = 196; // baseline of the background scenery

// ---------- Pixel sprites ----------
// Each char maps to a color; '.' is transparent.
const PAL = {
  R: '#d62839', r: '#9e1b2a', W: '#ffffff', w: '#d8e2f0', S: '#f2c09b',
  K: '#1b1b1b', G: '#f7c843', g: '#b8862b', B: '#7a4a24', b: '#4f2f17',
  N: '#e23b3b', E: '#2e7d32', e: '#1b5e20', Y: '#ffe680', O: '#ff9a3c',
  H: '#808080', I: '#bfe8ff', i: '#7cc4ef', C: '#8c3b2c', c: '#5e241a', M: '#c7c7c7'
};

function makeSprite(rows) {
  const h = rows.length, w = rows[0].length;
  const s = document.createElement('canvas');
  s.width = w; s.height = h;
  const x = s.getContext('2d');
  rows.forEach((row, y) => {
    [...row].forEach((ch, px) => {
      if (ch !== '.' && PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(px, y, 1, 1); }
    });

  return s;
}

// Santa in sleigh with one reindeer (two wing-ish leg frames)
const sleighA = makeSprite([

  '....RRRRR............BbB...',
  '....SSKSS............bB....',
  '....WWWWW...........BBBN...',
  '..GGRRRRRRSHHHHHHHHBBBBB...',
  '.GRRRRRRRRRRRRRGG..BBBB....',
  '.GRRRRRRRRRRRRRG.BBBBBB....',
  '..GRRRRGGRRRRRG..BBBBBB....',
  '...GRRRRRRRRRG...B.B..B....',
  '....GGGGGGGGG...B...B......',
  '..g..gg.....g..............',
  '...gggggggggggg............',
]);
const sleighB = makeSprite([
  '......RRW..................',
  '.....RRRRW...........B.B...',
  '....RRRRR............BbB...',
  '....SSKSS............bB....',
  '....WWWWW...........BBBN...',
  '..GGRRRRRRSHHHHHHHHBBBBB...',
  '.GRRRRRRRRRRRRRGG..BBBB....',
  '.GRRRRRRRRRRRRRG.BBBBBB....',
  '..GRRRRGGRRRRRG..BBBBBB....',
  '...GRRRRRRRRRG....B..B.....',
  '....GGGGGGGGG.....B..B.....',
  '..g..gg.....g..............',
  '...gggggggggggg............',
]);

// The odd bird: a grumpy robin flying left, two wing frames
// Santa without his hat (it flies off when he crashes): same sprites, hat wiped, bald head
function bald(spr) {
  const c = document.createElement('canvas');
  c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d');
  g.drawImage(spr, 0, 0); g.clearRect(0, 0, 13, 3);

}
const sleighBaldA = bald(sleighA), sleighBaldB = bald(sleighB);
const hatSprite = makeSprite([
  '.....WW',
  '...RRWW',
  '..RRRR.',
  '.RRRRR.',
  'WWWWWWW',
]);

const birdA = makeSprite([
  '......bb..',
  '......bbb.',
  '..BB..bb..',
  '.BKBBBBBBb',
  'OBBBBBBBb.',
  '.RRRBBBB..',
  '..RRRB....',
]);
const birdB = makeSprite([
  '..........',
  '..BB......',
  '.BKBBBBBBb',
  'OBBBBBBBb.',
  '.RRRBbbB..',
  '..RRbbb...',
  '.....bb...',
]);

// Presents in a mix of wrapping colors: X = paper, x = shaded side, Y = ribbon
const PRESENT_ROWS = [
  '..Y.Y..',
  '...Y...',
  'XXXYXXx',
  'XXXYXXx',
  'YYYYYYY',
  'XXXYXXx',
  'XXXYXXx',
];
const PRESENT_COLORS = [
  ['#d62839', '#9e1b2a', '#f7c843'], // red with gold ribbon
  ['#2e9e44', '#1b6b2c', '#ff4d4d'], // green with red ribbon
  ['#2f6fd6', '#1d4a99', '#ffffff'], // blue with white ribbon
  ['#8e44c9', '#5e2a8a', '#f7c843'], // purple with gold ribbon
  ['#ff6fae', '#c94a85', '#ffffff'], // pink with white ribbon
  ['#f2b134', '#b8862b', '#d62839'], // gold with red ribbon
  ['#1fb5a8', '#137a71', '#ffe680'], // teal with yellow ribbon
];
function makePresent([paper, shade, ribbon]) {
  const c = document.createElement('canvas');
  c.width = 7; c.height = 7;
  const x = c.getContext('2d');
  PRESENT_ROWS.forEach((row, py) => [...row].forEach((ch, px) => {
    const col = { X: paper, x: shade, Y: ribbon }[ch];

}
// the super present flashes between these two
const superPresentA = makePresent(['#ffe14d', '#e0b020', '#ffffff']);
const superPresentB = makePresent(['#ffffff', '#e8e8f0', '#ffe14d']);
const presents = PRESENT_COLORS.map(([paper, shade, ribbon]) => {
  const c = document.createElement('canvas');
  c.width = 7; c.height = 7;
  const x = c.getContext('2d');
  PRESENT_ROWS.forEach((row, py) => [...row].forEach((ch, px) => {
    const col = { X: paper, x: shade, Y: ribbon }[ch];
    if (col) { x.fillStyle = col; x.fillRect(px, py, 1, 1); }
  }));
  return c;
});

// Pine trees in several sizes, built from stacked tiers with snowy tips
function makeTree(h) {
  const trunk = 3, f = h - trunk, tiers = h < 12 ? 2 : 3;
  const rows = [];
  for (let i = 0; i < tiers; i++) {
    const y0 = Math.round(i * f / tiers), y1 = Math.round((i + 1) * f / tiers) + (i < tiers - 1 ? 1 : 0);
    for (let y = y0; y < y1; y++) rows[y] = { hw: i + Math.floor((y - y0) * 0.9), top: y === y0 && i > 0 };
  }
  const maxHw = Math.max(...rows.map(r => r.hw));
  const w = maxHw * 2 + 1, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, y) => {
    x.fillStyle = '#2e7d32'; x.fillRect(maxHw - r.hw, y, r.hw * 2 + 1, 1);
    x.fillStyle = '#1b5e20'; x.fillRect(maxHw + 1, y, r.hw, 1);           // shaded right side
    if (r.hw > 0) { x.fillStyle = '#ffffff'; x.fillRect(maxHw - r.hw, y, 1, 1); } // snow on left edge
  });

  x.fillStyle = '#4f2f17'; x.fillRect(maxHw, f, 1, trunk);

  c.lights = [];
  const COLORS = ['#ff4d4d', '#ffd84d', '#4dd2ff', '#7dff6b', '#ff7de9'];
  for (let y = 3; y < f; y += 3) {
    const hw = rows[y].hw;
    for (let dx = -hw + 1 + (y % 2); dx < hw; dx += 3)

  }

const TREE_SIZES = [10, 18, 13, 24, 9, 15, 20, 11];
const trees = TREE_SIZES.map(makeTree);
const LIT = [1, 3, 5, 6]; // which trees get fairy lights

// ---------- Game state ----------
const GRAV = 0.2, JUMP = -3.6, JUMP2 = -3.3, SANTA_X = 30, COYOTE = 6;
let scrollX = 0, smoke = [], speed = 1.0;
// ---------- Super present / rocket mode ----------
// A rare flashing super present straps rockets to the sleigh: Santa blasts forward at
// nearly double speed, invincible (through chimneys, birds bounce off, can't fall), and
// the controls change: hold to rise, let go to sink. A stream of bonus presents comes at
// him. In the last second the rockets sputter; when they cut out he gets a hop and two
// air jumps so he can always land safely.
const ROCKET_TIME = 300;                   // frames (5 s)
// ---------- Icy roofs and chimney fires ----------
// Ice: land on it and Santa skids forward, unable to stop, so jump off quickly; he drifts
// back to his usual spot once he's off. Fire: the chimney smokes, flickers as a warning,
// then flares for a moment; touching the flames is a crash.
const ICE_FROM = 20 * 60, FIRE_FROM = 40 * 60;     // frames of play before each appears
const FIRE_CYCLE = 150, FIRE_WARN = 80, FIRE_FLARE = 105;   // 2.5 s cycle: smoke, flicker, flare
const firePhase = p => (playFrames + p.fire.off) % FIRE_CYCLE;
// How far Santa travels in the air with a well-timed double jump at the current speed,
// landing back at the height he took off from (keeps fire chimneys jumpable over)
function airReach() {
  const k = Math.sqrt(speed), g = GRAV * k * k, j1 = JUMP * k, j2 = JUMP2 * k, cap = 6 * k;
  let best = 0;
  for (let dj = 1; dj < 60; dj++) {
    let y = 0, vy = j1, t = 0;
    while (t < 400) { t++; if (t === dj) vy = j2; vy = Math.min(vy + g, cap); y += vy; if (y >= 0 && vy > 0) break; }
    best = Math.max(best, t * speed);
  }
  return best;
}
// "HOLD TO FLY!" only shows for the very first super present on this device
let rocketHintSeen = false;
try { rocketHintSeen = localStorage.getItem('crimboRocketHintSeen') === '1'; } catch {}
let rocket = null, holding = false, boost = 1, move = 1;
// Pause: tap the pause button (or P / Esc), or switch away from the game. Tapping again
// counts down 3-2-1 before play carries on, so you're not caught off guard.
let resumeIn = 0;
// Crash effects: the screen shakes and Santa's hat flies off
let shakeT = 0, hat = null;
let birds = [];
// ---------- Blizzards ----------
// From 60 seconds into a run, every 20-30 seconds the snow comes down thick for a few
// seconds: the background fades out, snow drives sideways and a white haze builds up
// on the right, so you see what's coming later. Chimneys made around a blizzard come
// out slightly wider and closer together to keep it fair.
const BLIZZARD_START = 60 * 60;            // frames of play before the first one (60 s)
let playFrames = 0, nextBlizzard = 0, blizzard = null, blizzardCount = 0;
const blizzardFlakes = Array.from({ length: 180 }, () => ({ x: Math.random() * 144, y: Math.random() * 400, s: Math.random() }));
function blizzardLevel() {                 // 0 = clear, 1 = full storm (eases in and out)
  if (!blizzard) return 0;
  return Math.min(1, blizzard.t / 40, (blizzard.dur - blizzard.t) / 60);
}
// true while a blizzard is on, or about to arrive by the time new chimneys scroll on screen
const blizzardNear = () => !!blizzard || (playFrames > 0 && nextBlizzard - playFrames < 150);
// Hungover Santa mutters now and then
const SANTA_LINES = ["Ow my head", "I'm still drunk", "I feel like death", "I'm so hungover", "Why did I drink so much", "*burp*",
  "She's going to kill me", "I'm gonna be sick"];
const SPEECH_TIME = 120;                   // frames a bubble stays up (2 s)
const SPEECH_WRAP = 8;                     // max characters per line, keeps the bubble about sleigh-width
let speech = null, nextSpeech = 0, lastLine = -1;
let state, santa, platforms, gifts, score, best, frame, flakes, stars, particles, deathMsg, dist;

// ---------- Story and Endless modes ----------
// Story: saving 100 presents ends the run with the ending movie. Finishing it once unlocks
// Endless mode (toggled on the title screen): no ending, play on for a high score. Each
// mode keeps its own best score; "best" is always the best for the mode being played.
let completed = false, endless = false, justUnlocked = 0;
try { completed = localStorage.getItem('crimboCompleted') === '1'; endless = completed && localStorage.getItem('crimboEndless') !== '0'; } catch {}
const bestKey = () => endless ? 'crimboBestEndless' : 'crimboBestPresents';

best = loadBest();

stars = Array.from({ length: 40 }, () => ({
  x: Math.random() * W, y: Math.random() * (GROUND - 40) - 40, t: Math.random() * 100
}));
flakes = Array.from({ length: 50 }, () => ({
  x: Math.random() * W, y: Math.random() * H, s: Math.random() * 0.5 + 0.3
}));

const rnd = (a, b) => a + Math.random() * (b - a);

function reset() {
  state = 'ready';
  // start on a wide snowy rooftop
  platforms = [{ x: -10, w: 110, top: 200, kind: 'roof', landed: true }];
  santa = { x: SANTA_X, y: 200 - 13, vy: 0, grounded: COYOTE, jumps: 0, onPlat: true, buffer: 0 };
  gifts = []; particles = []; smoke = []; birds = [];
  playFrames = 0; blizzard = null; blizzardCount = 0;
  nextBlizzard = BLIZZARD_START + Math.random() * 300;
  speech = null; nextSpeech = 150 + Math.random() * 120; // first line after ~3-5 s
  score = 0; frame = 0; speed = 1.0; dist = 0;
  rocket = null; boost = 1; move = 1; holding = false;
  resumeIn = 0; shakeT = 0; hat = null;
  fillPlatforms();

// Keep generating chimneys ahead of the player
// ---------- Difficulty progression ----------
// 0 at the start, rising to 1 after FULL_DIFFICULTY pixels travelled (roughly 90 seconds).
// Early on: slow, wide chimneys packed close together, gentle height changes, no birds.
// Later: faster, narrower chimneys with bigger gaps, bigger height changes, more birds.
const FULL_DIFFICULTY = 9000;
const lerp = (a, b, t) => a + (b - a) * t;
const difficulty = () => Math.min(1, dist / FULL_DIFFICULTY);

// Keep generating chimneys ahead of the player
function fillPlatforms() {
  let last = platforms[platforms.length - 1];
  while (last.x + last.w < W + 80) {
    const d = difficulty();
    // whole-pixel gaps keep every chimney on the same sub-pixel offset, so they all
    // round to the screen together and never wobble out of step with each other
    const easy = blizzardNear();   // blizzard: a bit closer and wider, never noticeably so
    // special chimneys (never during rocket runs or blizzards): icy roofs from 20 s,
    // chimney fires from 40 s, getting a little more common over the next minute
    let type = 'plain';
    if (!rocket && !easy) {
      if (playFrames > ICE_FROM && Math.random() < lerp(0.18, 0.28, Math.min(1, (playFrames - ICE_FROM) / 3600))) type = 'ice';
      else if (playFrames > FIRE_FROM && !last.fire && Math.random() < lerp(0.14, 0.24, Math.min(1, (playFrames - FIRE_FROM) / 3600))) type = 'fire';
    }
    if (last.fire) type = 'plain';  // straight after a fire chimney: always a plain one
    const fire = type === 'fire';
    let gap = Math.round(rnd(lerp(8, 30, d), lerp(18, 58, d)) * (easy ? 0.8 : 1));
    let w = Math.round(rnd(lerp(30, 18, d), lerp(42, 28, d))) + (easy ? 4 : 0);
    const rise = lerp(10, 26, d), drop = lerp(12, 34, d);
    let top = Math.max(115, Math.min(215, last.top + rnd(-rise, drop)));
    // Fire chimneys must always be jumpable *over*, from the chimney before to the one after,
    // in case it's about to flare. So: the whole distance (gap + fire chimney + gap) stays within
    // 70% of how far a double jump reaches at this speed, the fire chimney is never higher than
    // the one before (so you can't clip its side), and the one after isn't much higher either.
    let overFire = null;
    if (fire) {
      const budget = Math.floor((airReach() + 21) * 0.7);   // 21 = Santa's width
      w = Math.round(rnd(22, 28));
      gap = Math.max(8, Math.min(gap, budget - w - 12));
      top = Math.max(top, last.top + 4);
      overFire = { left: budget - gap - w, fromTop: last.top };
    } else if (last.fire) {
      gap = Math.max(6, Math.min(gap, last.overFire.left));
      top = Math.min(215, Math.max(top, last.overFire.fromTop - 4));
    }
    const p = { x: last.x + last.w + gap, w, top, kind: 'chimney', smokes: fire || Math.random() < 0.5, landed: false,
                ice: type === 'ice', fire: fire ? { off: Math.floor(Math.random() * FIRE_CYCLE) } : null, overFire };
    if (Math.random() < 0.5) gifts.push({
      x: last.x + last.w + Math.round(gap / 2) - 3, y: Math.min(last.top, top) - rnd(lerp(18, 26, d), lerp(30, 42, d)), got: false,
      look: Math.floor(Math.random() * presents.length),
      // now and then (after the first 10 s, one at a time, not during a rocket run) a super present
      super: !rocket && playFrames > 600 && !gifts.some(g => g.super && !g.got) && Math.random() < 0.1,
    });
    // birds start appearing after a while, then get more common. A robin is decided one
    // chimney late (once the chimney after it exists) so the fairness check below can see
    // where Santa will be when it reaches him, and what he could jump to.
    // Fewer than before: about 1 chimney in 8 at most, and never within 3 chimneys of another.
    if (d > 0.15 && last.w >= 20 && !last.fire && !platforms.slice(-4, -1).some(q => q.robin)
        && Math.random() < lerp(0.08, 0.26, (d - 0.15) / 0.85))
      tryBird(last, p);
    platforms.push(p);
    last = p;
  }
}
// ---------- Fair robins ----------
// A robin flies in faster than the chimneys. It's timed to reach Santa while he's on a
// particular chimney, at head height for that chimney, so he has to jump over it. Before adding one, play it out: is there a window
// of at least 6 frames where Santa, standing on that chimney, can jump (and double jump if
// needed), clear the robin and land safely on that chimney or the next one? If not (say the
// next gap is too wide to reach from where he'd have to take off), no robin.
function tryBird(M, next) {
  if (M.ice) return;                                       // skidding on ice too: not fair
  const v = robinDrift(), sp = speed, t0 = Math.random() * 60;
  // pick where on this chimney the robin reaches Santa, then start it far enough out
  // (it's a bit faster than the chimneys) that it gets there at that moment
  const cx = M.w > 24 ? rnd(M.x + 12, M.x + M.w - 12) : M.x + M.w / 2;   // Santa's middle then
  const meet = Math.round((cx - SANTA_X - 13) / sp);
  const bx = Math.round(SANTA_X + 12 + meet * (sp + v));
  if (bx < W + 4) return;                                  // would pop up on screen
  const y = M.top - 9;
  if (fairBird(M, next, bx, y, t0, v, sp, meet)) { birds.push({ x: bx, y, t: t0 }); M.robin = true; }
}
// How much faster than the chimneys robins fly (kept gentle so they're easy to read)

  });
  birds = birds.filter(b => b.x > -12 && b.y < H + 20);
  platforms = platforms.filter(p => p.x + p.w > -20);
  gifts = gifts.filter(g => g.x > -10 && !g.got);
  fillPlatforms();

  if (rocket) { rocketStep(); return; }

  const prevFeet = santa.y + 13;
  const k = jumpScale();
  santa.vy = Math.min(santa.vy + GRAV * k * k, 6 * k);
  santa.y += santa.vy;
  const feet = santa.y + 13, left = santa.x + 3, right = santa.x + 24;

  let onPlat = false, onIce = false;
  for (const p of platforms) {
    if (left >= p.x + p.w || right <= p.x) continue;
    if (santa.vy >= 0 && prevFeet <= p.top + 1 && feet >= p.top) {
      // landed on top
      santa.y = p.top - 13; santa.vy = 0; onPlat = true;
      if (p.ice) { if (santa.grounded <= 0) sfx.iceLand(); onIce = true; }
      if (santa.grounded <= 0) { burst(santa.x + 12, p.top, 6, '#ffffff', 0.8, 15); santa.landedAt = playFrames; }
      p.landed = true;
    } else if (feet > p.top + 2) {
      die('CRASH!');                               // ran into the side of a chimney
      return;
    }
  }
  santa.onPlat = onPlat;
  // a little longer to jump after running off an edge as the game speeds up (6 to 9 frames)
  if (onPlat) { santa.grounded = Math.round(COYOTE * k); santa.jumps = 0; }
  if (santa.buffer > 0 && --santa.buffer > 0 && onPlat) groundJump();   // early tap, now landed
  else {
    // walked off an edge: only the double jump left (checked once, as coyote time runs out)
    if (--santa.grounded === 0 && santa.jumps === 0) santa.jumps = 1;
  }
  // ice: skid forward faster and faster; off the ice, drift back to the usual spot
  if (onIce) {
    santa.slide = Math.min(1.3, (santa.slide || 0) + 0.035);
    santa.x = Math.min(SANTA_X + 40, santa.x + santa.slide);
    if (frame % 8 === 0) sfx.skid();
    if (frame % 3 === 0) particles.push({ x: santa.x + 4, y: santa.y + 12, vx: -0.6, vy: -0.4, life: 12, c: '#dff4ff' });
  } else {
    santa.slide = 0;
    if (santa.x > SANTA_X) santa.x = Math.max(SANTA_X, santa.x - 0.3);
  }
  // fire: touching the flames while a chimney is flaring is a crash
  for (const p of platforms) {
    if (!p.fire) continue;
    const ph = firePhase(p);
    if (ph === FIRE_FLARE && p.x < W && p.x + p.w > 0) sfx.flare();
    if (ph >= FIRE_FLARE && left < p.x + p.w - 3 && right > p.x + 3 && santa.y + 12 > p.top - 14 && santa.y < p.top + 2) {
      burst(santa.x + 12, santa.y + 10, 16, '#ff9a3c', 1.4, 30);
      sfx.burn(); die('CRASH!'); return;
    }
  }

  if (santa.y > H) die('FELL!');

  const box = { x: left, y: santa.y + 2, w: right - left, h: 10 };
  for (const b of birds) {
    if (b.stomped) continue;
    // Just landed (less than LAND_GRACE frames ago, too soon to react)? A robin about to
    // fly into Santa flutters up over his head instead. Any later and it's on you to jump.
    if (!b.hopped && santa.onPlat && playFrames - santa.landedAt < LAND_GRACE && b.x < right + 6 && b.x + 9 > left) {
      const sy = santa.y + 2, ry = robinY(b);
      if (sy < ry + 9 && sy + 10 > ry) { b.hop = 1; b.hopped = true; sfx.hop(); }
    }
    if (b.hop) continue;
    const by = robinY(b);
    // a forgiving hit area: Santa's body, not the tips of the sleigh and reins
    if (box.x + 3 < b.x + 9 && box.x + box.w - 3 > b.x + 1 && box.y + 1 < by + 7 && box.y + box.h - 1 > by + 2) {
      // Coming down on top of a robin: stomp it. Santa bounces up like a fresh jump
      // and gets his double jump back. Hitting one any other way is still a crash.
      if (santa.vy > 0 && prevFeet <= by + 5) {   // feet were above its middle
        b.stomped = true; b.vy = -1;
        santa.vy = JUMP * k; santa.jumps = 1; santa.grounded = 0; santa.buffer = 0;
        burst(b.x + 5, by + 4, 10, '#7a4a24', 1.2, 30);
        sfx.stomp();
        continue;
      }
      burst(b.x + 5, by + 4, 10, '#7a4a24', 1.2, 30);
      die('BIRDSTRIKE!');
      return;
    }
  }
  gifts.forEach(g => {
    if (!g.got && box.x < g.x + 7 && box.x + box.w > g.x && box.y < g.y + 7 && box.y + box.h > g.y) {
      g.got = true; score++;   // score = presents saved
      sfx.present();
      burst(g.x + 3, g.y + 3, 10, '#f7c843', 1, 25);
      if (score >= ENDING_AT) startEnding();
      else if (g.super) startRocket();
    }
  });
}

function startRocket() {
  santa.x = SANTA_X; santa.slide = 0;
  rocket = { t: 0, hint: !rocketHintSeen };
  if (!rocketHintSeen) { rocketHintSeen = true; try { localStorage.setItem('crimboRocketHintSeen', '1'); } catch {} }
  santa.vy = -1.5;
  sfx.rocketStart();
  speech = { lines: wrapText('WAHEEEY!', SPEECH_WRAP), life: 90 };
  burst(santa.x + 12, santa.y + 6, 24, '#ffe14d', 1.6, 30);
}

// One frame of rocket flight: hold to rise, let go to sink, invincible
function rocketStep() {
  const ending = rocket.t > ROCKET_TIME - 60;
  // In the last second the rockets take over: they glide Santa down to just above the next
  // safe chimney (not burning or icy) and only cut out once he's over it, so he always lands.
  // (not over the last few pixels of a chimney, so there's room to land and then jump)
  const target = ending ? platforms.find(p => !p.fire && !p.ice && p.x + p.w - 9 > santa.x + 12) : null;
  if (target) {
    const hoverY = target.top - 16;
    santa.vy = Math.max(-5, Math.min(5, (hoverY - santa.y) * 0.3));   // quick enough to catch fast chimneys
  } else {
    const firing = holding && !(ending && (rocket.t >> 2) % 3 === 0);   // sputters near the end
    santa.vy = Math.max(-3, Math.min(3, santa.vy + (firing ? -0.42 : 0.28)));
  }
  santa.y += santa.vy;
  const top = Math.ceil(SAFE_TOP) - OY + 4, bottom = target ? 220 : 190;   // landing: can go lower
  if (santa.y < top) { santa.y = top; santa.vy = 0; }
  if (santa.y > bottom) { santa.y = bottom; santa.vy = 0; }
  // exhaust: flames and sparkles out of the back
  for (let i = 0; i < 2; i++) particles.push({
    x: santa.x - 4, y: santa.y + 7 + Math.random() * 3, vx: -1 - Math.random() * 1.5, vy: (Math.random() - 0.5) * 0.6,
    life: 10 + Math.random() * 8, c: ['#ffe14d', '#ff9a3c', '#ffffff', '#ff6b3c'][Math.floor(Math.random() * 4)],
  });
  if (frame % 6 === 0) sfx.rocketRumble(ending);
  // a stream of bonus presents to steer into
  if (!ending && rocket.t % 18 === 0) gifts.push({ x: W + 4, y: 30 + Math.random() * 140, got: false, look: Math.floor(Math.random() * presents.length) });
  // birds just bounce off
  const box = { x: santa.x + 3, y: santa.y + 2, w: 21, h: 10 };
  birds.forEach(b => {
    const by = b.y + Math.sin(b.t / 12) * 2;
    if (box.x < b.x + 9 && box.x + box.w > b.x + 1 && box.y < by + 7 && box.y + box.h > by + 2) {
      burst(b.x + 5, by + 4, 10, '#7a4a24', 1.4, 25); b.x = -100; sfx.bonk();
    }
  });
  gifts.forEach(g => {
    if (!g.got && box.x < g.x + 7 && box.x + box.w > g.x && box.y < g.y + 7 && box.y + box.h > g.y) {
      g.got = true; score++; sfx.present(); burst(g.x + 3, g.y + 3, 10, '#f7c843', 1, 25);
      if (score >= ENDING_AT) startEnding();
    }
  });
  // time's up and he's over a safe chimney: cut out (the rockets keep going until he is)
  const centre = santa.x + 12;
  const over = target && centre > target.x + 2 && centre < target.x + target.w - 9 && Math.abs(santa.y - (target.top - 16)) < 8;
  if ((rocket.t >= ROCKET_TIME && over) || rocket.t >= ROCKET_TIME + 600) {   // (the 10 s backstop should never be needed)
    rocket = null; boost = 1;
    if (over) { santa.y = target.top - 13.5; santa.vy = 0.3; }   // drops straight onto it
    else santa.vy = -2.5;
    santa.jumps = 0; santa.grounded = -1;                        // two air jumps, just in case
    sfx.rocketEnd();
  }
}

// ---------- Drawing ----------
function rect(c, x, y, w, h) { DC.fillStyle = c; DC.fillRect(Math.round(x), Math.round(y), w, h); }

// ---------- Pre-drawn scenery ----------
// The moon, hills, snow bank and logo used to be drawn pixel by pixel every frame (hundreds
// of tiny drawing calls). They're now drawn once into images and reused, which is much
// lighter on phone batteries and smoother on older phones.
function offscreen(w, h, paint) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  DC = c.getContext('2d'); paint(); DC = ctx;
  return c;
}
const LOOP = 880; // the hills and snow bank repeat every 880px, so each is one pre-drawn strip
const wave = (x, n) => Math.sin(x * Math.PI * 2 * n / LOOP);
const hillHeight = x => 14 + wave(x, 10) * 5 + wave(x, 28) * 1.5;
const bankAt = x => GROUND - 6 - wave(x, 13) * 2 - wave(x, 6) * 2;   // x is in the bank's own scrolling coordinates
const moonImg = offscreen(19, 19, () => {
  const MX = 9, MY = 9, MR = 9;
  for (let dy = -MR; dy <= MR; dy++) for (let dx = -MR; dx <= MR; dx++) {
    const d = dx * dx + dy * dy;
    if (d <= MR * MR + MR) rect(d > (MR - 1) * (MR - 1) + MR - 1 && dx + dy > 0 ? '#e8d9a0' : '#fff3c4', MX + dx, MY + dy, 1, 1);
  }
  rect('#e8d9a0', MX - 4, MY - 3, 3, 3); rect('#e8d9a0', MX + 2, MY + 2, 2, 2); rect('#e8d9a0', MX + 3, MY - 5, 1, 1); // craters
});
const hillsImg = offscreen(LOOP + W, 22, () => {
  for (let x = 0; x < LOOP + W; x++) { const h = hillHeight(x); rect('#a9b8d0', x, 22 - h, 1, h); }
});
const bankImg = offscreen(LOOP + W, 14, () => {   // covers GROUND - 12 to GROUND + 2
  for (let x = 0; x < LOOP + W; x++) {
    const y = Math.round(bankAt(x)) - (GROUND - 12);
    rect('#bfcbdd', x, y, 1, 14 - y); rect('#d3dcea', x, y, 1, 1);
  }
});

function drawSky() {
  const bands = ['#0b1026', '#111a3a', '#18244d', '#213160', '#2b3f73'];
  const bh = Math.ceil(GROUND / bands.length);
  bands.forEach((c, i) => rect(c, 0, i * bh, W, bh));
  stars.forEach(s => {
    if ((frame + s.t) % 60 < 50) rect('#fff7c2', s.x, s.y, 1, 1);
  });
  ctx.drawImage(moonImg, 102, 20);
  // far hills scroll slowly (parallax layer 1)
  const hx = Math.round((scrollX + ox) * 0.2) % LOOP;
  ctx.drawImage(hillsImg, hx, 0, W, 22, 0, GROUND - 22, W, 22);
  // near snow bank + trees scroll together at half speed (parallax layer 2)
  // whole pixels for everything in this layer, so the trees and drifts move in lockstep
  // with the pre-drawn snow bank (fractions made them judder against it)
  const txr = Math.round((scrollX + ox) * 0.5), txi = txr % LOOP;
  const bankY = sx => bankAt(sx + txi);
  const span = W + 40;
  trees.forEach((t, i) => {
    const x = (((i * 23 - txr) % span) + span) % span - 20;
    const base = bankY(x + Math.floor(t.width / 2));
    const ty = Math.round(base - t.height + 3);
    ctx.drawImage(t, Math.round(x), ty); // trunk sinks into the snow
    if (LIT.includes(i)) t.lights.forEach((l, j) => {
      if ((Math.floor(frame / 15) + j) % 3) rect(l.c, Math.round(x) + l.x, ty + l.y, 1, 1);
    });
  });
  ctx.drawImage(bankImg, txi, 0, W, 14, 0, GROUND - 12, W, 14);
  rect('#bfcbdd', 0, GROUND + 2, W, H);   // snow runs all the way to the bottom
  // soft drifts in the snowfield, scrolling with the trees
  for (let i = 0; i < 6; i++) {
    const x = (((i * 31 - txr) % span) + span) % span - 20;
    rect('#aebcd2', x, GROUND + 8 + (i * 17) % 44, 10 + (i % 3) * 4, 1);
  }
}

function drawRoof(p) {
  const x = Math.round(p.x - ox), top = Math.round(p.top);
  rect('#3b4a6b', x, top + 3, p.w, H - top);
  for (let row = 0; top + 5 + row * 4 < H; row++) {
    const y = top + 5 + row * 4;
    rect('#2c3854', x, y, p.w, 1);
    for (let bx = row % 2 ? 0 : 4; bx < p.w; bx += 8) rect('#2c3854', x + bx, y, 1, 4);
  }
  rect('#ffffff', x, top, p.w, 3);
  for (let i = 3; i < p.w; i += 7) rect('#ffffff', x + i, top + 3, 2, 1 + (i % 3));
}

function drawChimney(p) {
  const x = Math.round(p.x - ox), top = Math.round(p.top), w = p.w;
  // brick stack (inset from the cap)
  rect('#8c3b2c', x + 3, top + 8, w - 6, H - top);
  for (let row = 0; top + 8 + row * 4 < H; row++) {
    const y = top + 8 + row * 4;
    rect('#5e241a', x + 3, y, w - 6, 1);
    for (let bx = row % 2 ? 0 : 5; bx < w - 6; bx += 10) rect('#5e241a', x + 3 + bx, y, 1, 4);
  }
  rect('#5e241a', x + w - 4, top + 8, 1, H - top); // shaded edge
  // cap (the landing surface)
  rect('#6e2c20', x, top + 2, w, 7);
  rect('#2a2a2a', x + 5, top + 3, w - 10, 2);
  if (p.ice) {                       // shiny ice with icicles hanging off the cap
    rect('#cfeeff', x - 1, top, w + 2, 3); rect('#ffffff', x + 2, top, 5, 1); rect('#ffffff', x + w - 8, top + 1, 3, 1);
    rect('#9fd8f5', x - 1, top + 2, w + 2, 1);
    for (let i = 1; i < w; i += 4) { const len = 2 + ((i * 7 + p.w) % 4); rect('#bfe8ff', x + i, top + 9, 1, len); rect('#ffffff', x + i, top + 9, 1, 1); }
  } else if (p.fire) {               // snow melted off; scorch marks; flames by phase
    rect('#3a1a12', x, top + 2, w, 2);
    const ph = firePhase(p);
    if (ph >= FIRE_WARN) {
      const big = ph >= FIRE_FLARE, n = Math.floor((w - 10) / 3);
      if (big) rect('rgba(255,150,60,0.25)', x + 2, top - 18, w - 4, 20);
      for (let i = 0; i < n; i++) {
        const fx = x + 5 + i * 3, flick = (frame + i * 7) % 6;
        const hgt = big ? 8 + ((i * 5 + frame) % 7) : 2 + (flick % 3);
        const h2 = Math.round(hgt * 0.6), h3 = Math.max(1, Math.round(hgt * 0.3));
        rect('#d62839', fx, top + 3 - hgt, 3, hgt); rect('#ff9a3c', fx, top + 3 - h2, 2, h2); rect('#ffe14d', fx + 1, top + 3 - h3, 1, h3);
      }
    }
  } else {                           // snow on top
    rect('#ffffff', x, top, w, 3);
    rect('#ffffff', x + 3, top - 1, 6, 1);
    if (w > 26) rect('#ffffff', x + w - 9, top - 1, 4, 1);
  }
}

function text(str, cx, y, scale = 1, color = '#fff', shadow = '#0b1026') {
  str = String(str).toUpperCase();
  const w = str.length * 4 * scale - scale;
  const x0 = Math.round(cx - w / 2);
  [[shadow, scale], [color, 0]].forEach(([c, off]) => {
    ctx.fillStyle = c;
    [...str].forEach((ch, i) => {
      const g = FONT[ch] || FONT[' '];
      for (let p = 0; p < 15; p++) if (g[p] === '1')
        ctx.fillRect(x0 + i * 4 * scale + (p % 3) * scale + off, y + Math.floor(p / 3) * scale + off, scale, scale);
    });
  });
}

// Intro story, word-wrapped to fit the pixel font (4px per character)
const STORY = "Oh crumbs! Santa was at the pub last night and got absolutely hammered. " +
  "On his way back, he dropped all the kids' presents. You'd better grab as many as you can " +
  "or some poor little buggers will be getting nothing!";
const STORY_LINES = (() => {
  const max = Math.floor((W - 8) / 4), lines = [];
  let line = '';
  STORY.split(' ').forEach(word => {
    if ((line + ' ' + word).trim().length > max) { lines.push(line); line = word; }
    else line = (line + ' ' + word).trim();
  });
  lines.push(line);
  return lines;
})();

// Smooth scrolling: the game logic runs at a fixed 60 steps/sec, but screens refresh at
// 120Hz, 30Hz, etc. Between steps we nudge everything that scrolls by the fraction of a
// step that has passed, so chimneys glide instead of stuttering 0/1/2 steps per frame.
let ox = 0, birdFactor = 1;

// Split a phrase into lines of at most `max` characters, breaking at spaces
function wrapText(str, max) {
  const lines = [];
  let line = '';
  str.split(' ').forEach(word => {
    if ((line + ' ' + word).trim().length > max) { lines.push(line); line = word; }
    else line = (line + ' ' + word).trim();
  });
  lines.push(line);
  return lines;
}

// Pixel speech bubble above Santa's head, with a little tail pointing down at him
function drawSpeech() {
  const lines = speech.lines;
  const tw = Math.max(...lines.map(l => l.length)) * 4 - 1;
  const bw = tw + 4, bh = lines.length * 6 + 3;
  const headX = Math.round(santa.x + 7);
  // bubble sits up and behind Santa (to the left), keeping the way ahead clear
  const bx = Math.max(1, headX + 4 - bw);
  const by = Math.max(2, Math.round(santa.y) - bh - 5);
  // pop in: small for the first few frames
  if (SPEECH_TIME - speech.life < 3) { rect('#ffffff', headX - 2, by + bh - 3, 5, 3); return; }
  rect('#0b1026', bx + 1, by, bw - 2, bh);           // outline (rounded corners)
  rect('#0b1026', bx, by + 1, bw, bh - 2);
  rect('#ffffff', bx + 1, by + 1, bw - 2, bh - 2);   // bubble
  // tail
  rect('#0b1026', headX - 1, by + bh - 1, 4, 2);
  rect('#0b1026', headX - 1, by + bh + 1, 2, 2);
  rect('#ffffff', headX, by + bh - 1, 2, 1);
  rect('#ffffff', headX, by + bh, 1, 1);
  lines.forEach((l, i) => text(l, bx + bw / 2, by + 2 + i * 6, 1, '#1b1b1b', '#ffffff'));
}

function logoWord(str, x, y, s, dx, dy) {
  const px = [];
  [...str].forEach((ch, i) => {
    const ox = x + i * 4 * s + (dx ? dx(i) : 0), oy = y + (dy ? dy(i) : 0);
    const big = s === 4 && LOGO_GLYPHS[ch];
    if (big) {
      big.forEach((row, ly) => [...row].forEach((c, lx) => { if (c === '1') px.push({ x: ox + lx, y: oy + ly, ly }); }));
      return;
    }
    const g = FONT[ch];
    for (let p = 0; p < 15; p++) if (g[p] === '1') {
      const cx = p % 3, cy = Math.floor(p / 3);
      for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) px.push({ x: ox + cx * s + a, y: oy + cy * s + b, ly: cy * s + b });
    }
  });
  return px;
}
function logoOutline(px, col) {
  DC.fillStyle = col;
  px.forEach(p => { for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if (a || b) DC.fillRect(p.x + a, p.y + b, 1, 1); });
}
const LOGO_H = 48; // height the logo takes up in the title panel
let logoTop = null, logoLetters = null;
function buildLogo() {
  logoTop = offscreen(W, 40, () => drawLogoTop(-6));   // as if drawn at y0 = 2
  logoLetters = [...'PANIC!'].map(ch => offscreen(11, 17, () => {
    const px = logoWord(ch, 1, 1, 3);
    logoOutline(px, '#3a0a12');
    px.forEach(p => rect(p.ly < 5 ? '#ffe680' : p.ly < 10 ? '#f7c843' : '#ff9a3c', p.x, p.y, 1, 1));
  }));
}
function drawLogo(y0) {
  if (!logoTop) buildLogo();
  const oy = y0 - 8;
  ctx.drawImage(logoTop, 0, y0 - 2);
  // PANIC!: gold, nervously shaking
  const sh = Math.floor(frame / 4);
  logoLetters.forEach((img, i) => {
    const dx = (sh * 7 + i * 13) % 5 === 0 ? 1 : ((sh * 3 + i * 5) % 7 === 0 ? -1 : 0);
    const dy = (sh + i) % 6 === 0 ? -1 : 0;
    ctx.drawImage(img, 38 + i * 12 - 1 + dx, oy + 38 - 1 + dy);
  });
  // twinkles
  [[126, 12], [10, 40], [122, 46], [130, 30]].forEach(([x, y], k) => {
    if ((frame + k * 17) % 50 < 25) { rect('#ffffff', x, oy + y - 1, 1, 3); rect('#ffffff', x - 1, oy + y, 3, 1); }
  });
}
function drawLogoTop(oy) {   // oy = y0 - 8; the logo was designed with the snow caps starting at y = 8
  // XMAS: red and white candy-cane stripes (4 letters, centred)
  const top = logoWord('XMAS', 42, oy + 10, 4);
  logoOutline(top, '#3a0a12');
  top.forEach(p => rect(((p.x + p.y) % 6 < 3) ? '#d62839' : '#ffffff', p.x, p.y, 1, 1));
  // snow settled on top of every letter, with the odd drip
  const tops = {};
  top.forEach(p => { if (tops[p.x] === undefined || p.y < tops[p.x]) tops[p.x] = p.y; });
  Object.entries(tops).forEach(([x, y]) => {
    x = +x;
    rect('#ffffff', x, y - 2, 1, 2); rect('#dfe8f5', x, y, 1, 1);
    if ((x * 7) % 11 === 0) rect('#ffffff', x, y + 1, 1, 2);
  });
  // holly sprig
  rect('#1b6b2c', 30, oy + 8, 4, 3); rect('#2e9e44', 31, oy + 7, 2, 5);   // holly sprig, just before the X
  rect('#1b6b2c', 35, oy + 10, 3, 4); rect('#2e9e44', 36, oy + 9, 1, 6);
  rect('#e23b3b', 33, oy + 11, 2, 2); rect('#ff4d4d', 35, oy + 13, 2, 2); rect('#e23b3b', 32, oy + 13, 2, 2);
}

// Draw the game shifted down by OY (0 on normal screens) and fill the extra sky above it
let pageBg = '';
function draw() {
  // the page around the game matches the darker intro screens, then the night sky
  const bg = state === 'intro' || state === 'splash' || state === 'ending' ? '#05070f' : '#0b1026';
  if (bg !== pageBg) { document.documentElement.style.background = document.body.style.background = pageBg = bg; }
  if (state === 'intro' || state === 'ending') { ctx.setTransform(1, 0, 0, 1, 0, 0); intro.draw(W, H, ''); return; }
  if (state === 'splash') {
    ctx.setTransform(1, 0, 0, 1, 0, OY);
    rect('#05070f', 0, -OY, W, H);
    drawLogo(90);
    if ((frame >> 5) % 2) text('TAP TO START', W / 2, 160, 1, '#f7c843');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    return;
  }
  // screen shake after a crash: a few pixels, dying away
  const mag = Math.ceil(shakeT / 7), sx = shakeT ? (frame % 4 < 2 ? mag : -mag) : 0, sy = shakeT ? (frame % 6 < 3 ? mag : -mag) : 0;
  if (shakeT) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0b1026'; ctx.fillRect(0, 0, W, H); } // no stale edges
  ctx.setTransform(1, 0, 0, 1, sx, OY + sy);
  rect('#0b1026', -4, -OY - 4, W + 8, OY + 4);
  drawScene();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// White haze that thickens towards the right, plus thick snow driving sideways
function drawBlizzard(bl) {
  const g = ctx.createLinearGradient(56, 0, W, 0);
  g.addColorStop(0, 'rgba(232,238,247,0)');
  g.addColorStop(1, `rgba(232,238,247,${(0.62 * bl).toFixed(2)})`);
  ctx.fillStyle = g; ctx.fillRect(0, -OY, W, H);
  const n = Math.floor(blizzardFlakes.length * bl);
  for (let i = 0; i < n; i++) {
    const f = blizzardFlakes[i], big = f.s > 0.75;
    rect(big ? '#ffffff' : 'rgba(255,255,255,0.8)', f.x, f.y, big ? 3 : 2, big ? 2 : 1);
  }
}

function drawScene() {
  drawSky();
  const bl = state === 'play' || state === 'over' || state === 'paused' ? blizzardLevel() : 0;
  if (bl > 0) rect(`rgba(200,210,226,${(0.7 * bl).toFixed(2)})`, 0, -OY, W, H); // storm hides the background
  platforms.forEach(p => p.kind === 'roof' ? drawRoof(p) : drawChimney(p));
  smoke.forEach(p => {
    const fade = 1 - p.age / p.max, r = Math.round(p.r);
    ctx.fillStyle = `rgba(${200 - p.age},${205 - p.age},${215 - p.age},${(0.75 * fade).toFixed(2)})`;
    const cx = Math.round(p.x - ox), cy = Math.round(p.y);
    ctx.fillRect(cx - r, cy - r + 1, r * 2 + 1, r * 2 - 1); // chunky pixel blob
    ctx.fillRect(cx - r + 1, cy - r, r * 2 - 1, r * 2 + 1);
  });
  if (bl > 0) drawBlizzard(bl);   // birds, presents and Santa stay in front of the storm
  birds.forEach(b => {
    const bx = Math.round(b.x - ox * birdFactor), by = Math.round(robinY(b));
    if (!b.stomped) { ctx.drawImage(Math.floor(b.t / 6) % 2 ? birdA : birdB, bx, by); return; }
    ctx.save(); ctx.translate(bx, by + 9); ctx.scale(1, -1); ctx.drawImage(birdA, 0, 0); ctx.restore();   // upside down, falling
  });
  gifts.forEach(g => {
    const gx = Math.round(g.x - ox), gy = Math.round(g.y + Math.sin((frame + g.x) / 8));
    if (!g.super) { ctx.drawImage(presents[g.look], gx, gy); return; }
    // super present: flashes yellow and white, with sparkles circling it
    rect('rgba(255,230,80,0.35)', gx - 2, gy - 2, 11, 11);
    ctx.drawImage((frame >> 3) % 2 ? superPresentA : superPresentB, gx, gy);
    for (let i = 0; i < 3; i++) { const a = frame / 10 + i * 2.1; rect('#ffffff', gx + 3 + Math.cos(a) * 7, gy + 3 + Math.sin(a) * 7, 1, 1); }
  });

  // Santa: reindeer trots on the ground, sleigh tilts in the air
  const onGround = santa.onPlat && !rocket;
  const flip = Math.floor(frame / (onGround && state === 'play' ? 5 : 10)) % 2;
  const spr = hat ? (flip ? sleighBaldA : sleighBaldB) : (flip ? sleighA : sleighB);
  ctx.save();
  ctx.translate(Math.round(santa.x + 13), Math.round(santa.y + 6));
  const ang = state === 'over' ? 0.6 : onGround ? 0 : Math.max(-0.35, Math.min(0.5, santa.vy * 0.08));
  ctx.rotate(Math.round(ang * 8) / 8);
  if (rocket) {
    // two rockets strapped to the back, with flickering flames
    const ending = rocket.t > ROCKET_TIME - 60, lit = !ending || (rocket.t >> 2) % 3 !== 0;
    [[0, '#c7c7c7'], [4, '#b0b0b0']].forEach(([dy, body]) => {
      rect(body, -19, -1 + dy, 8, 3); rect('#d62839', -12, -1 + dy, 2, 3); rect('#7a7a7a', -20, -1 + dy, 1, 3);
      if (lit) { const fl = 3 + ((frame + dy) % 4); rect('#ff9a3c', -20 - fl, dy, fl, 2); rect('#ffe14d', -22, dy, 2, 1); }
    });
    // invincible: gold sparkles circling the sleigh (blinking faster as the rockets run out)
    if (!ending || (frame >> 2) % 2) for (let i = 0; i < 6; i++) {
      const a = frame / 6 + i * 1.05, big = (frame + i * 5) % 12 < 4;
      rect(i % 3 ? '#ffe14d' : '#ffffff', Math.cos(a) * 17, Math.sin(a) * 10, big ? 2 : 1, big ? 2 : 1);
    }
  }
  ctx.drawImage(spr, -13, -6);
  ctx.restore();

  if (hat) { ctx.save(); ctx.translate(Math.round(hat.x), Math.round(hat.y)); ctx.rotate(hat.r); ctx.drawImage(hatSprite, -3, -2); ctx.restore(); }
  particles.forEach(p => rect(p.c, p.x - ox, p.y, 1, 1));
  if (speech && (state === 'play' || state === 'paused')) drawSpeech();
  // rocket mode just started: tell the player the controls have changed
  if (rocket && rocket.hint && rocket.t < 110 && (frame >> 3) % 3 !== 0) {
    text('HOLD TO FLY!', W / 2, 62, 2, '#ffe14d');
    text('LET GO TO DROP', W / 2, 78, 1, '#ffffff');
  }
  flakes.forEach(f => rect('#ffffff', f.x, f.y, 1, 1));

  if (state === 'play' || state === 'paused') text(score, W / 2, hudY(), 2); // presents saved, below the notch
  if (state === 'play') {           // pause button, top left
    const by = hudY() - 1;
    rect('rgba(11,16,38,0.55)', 3, by, 13, 12); rect('#ffffff', 6, by + 3, 2, 6); rect('#ffffff', 11, by + 3, 2, 6);
  }
  if (state === 'paused') {
    rect('rgba(11,16,38,0.8)', 22, 84, 100, 56);
    rect('#f7c843', 22, 84, 100, 1); rect('#f7c843', 22, 139, 100, 1);
    if (resumeIn) text(String(Math.ceil(resumeIn / 30)), W / 2, 102, 3, '#ffe14d');
    else {
      text('PAUSED', W / 2, 96, 2, '#ffffff');
      if ((frame >> 4) % 2) text('TAP TO CARRY ON', W / 2, 120, 1, '#f7c843');
    }
  }
  if (state === 'ready') {
    // panel sized to its content and centred in the sky above Santa's rooftop
    const lineH = 6, panelH = 6 + LOGO_H + 4 + STORY_LINES.length * lineH + 5 + 17 + 29 + (best ? 14 : 0) + 11;
    const py = Math.round((santa.y - 4 - panelH - OY + SAFE_TOP) / 2), px = 6, pw = W - 12;
    rect('rgba(11,16,38,0.94)', px, py, pw, panelH);
    rect('#f7c843', px, py, pw, 1); rect('#f7c843', px, py + panelH - 1, pw, 1);
    rect('#f7c843', px, py, 1, panelH); rect('#f7c843', px + pw - 1, py, 1, panelH);
    let y = py + 6;
    drawLogo(y); y += LOGO_H + 4;
    STORY_LINES.forEach(l => { text(l, W / 2, y, 1); y += lineH; });
    y += 5;
    text('TAP TO JUMP', W / 2, y, 1, '#bfe8ff'); y += 8;
    text('TAP AGAIN TO DOUBLE JUMP', W / 2, y, 1, '#bfe8ff'); y += 9;
    // options: three matching buttons (Music and Sound FX show a tick when on)
    uiButtons = [];
    const bw = 60, gap = 6, bx = Math.round(W / 2 - (bw * 2 + gap) / 2);
    menuButton(bx, y, bw, 'MUSIC', !musicMuted, toggleMusic);
    menuButton(bx + bw + gap, y, bw, 'SOUND FX', !fxMuted, toggleFx);
    y += 14;
    if (completed) {                  // Endless unlocked: it shares the row with Play Intro
      menuButton(bx, y, bw, 'PLAY INTRO', null, playIntro);
      menuButton(bx + bw + gap, y, bw, 'ENDLESS', endless, toggleEndless);
    } else menuButton(bx, y, bw * 2 + gap, 'PLAY INTRO', null, playIntro);
    y += 15;
    // best score on one line: small label, big gold number (for the mode being played)
    if (best) {
      const label = endless ? 'ENDLESS BEST' : 'BEST', lw = label.length * 4 - 1;
      const nw = String(best).length * 8 - 2, total = lw + 4 + nw, sx = W / 2 - total / 2;
      text(label, sx + lw / 2, y + 3, 1, '#bfe8ff');
      text(String(best), sx + lw + 4 + nw / 2, y, 2, '#ffe680');
      y += 14;
    }
    if (justUnlocked > 0) {           // just finished the story for the first time
      if ((frame >> 3) % 2) text('ENDLESS MODE UNLOCKED!', W / 2, y, 1, '#ffe14d');
    } else if (Math.floor(frame / 20) % 2) text('TAP TO START', W / 2, y, 1, '#f7c843');
    // version number in the bottom corner (above the home bar), to check for updates
    const vy = H - OY - 9 - Math.ceil(SAFE_BOTTOM), label = 'V' + BUILD;
    text(label, W - 4 - (label.length * 4 - 1) / 2, vy, 1, '#9aa6c4');
  }
  if (state === 'over') {
    rect('rgba(11,16,38,0.6)', 22, 70, 100, 80);
    rect('#f7c843', 22, 70, 100, 1); rect('#f7c843', 22, 149, 100, 1);
    text('CRASH!', W / 2, 80, 2, '#d62839', '#fff'); // same message however you die (sounds still differ)
    text('PRESENTS SAVED ' + score, W / 2, 104, 1);
    text((endless ? 'ENDLESS BEST ' : 'BEST ') + best, W / 2, 116, 1, '#ffe680');
    if (frame > 30 && Math.floor(frame / 20) % 2) text('TAP TO RETRY', W / 2, 134, 1);
  }
}

// Fixed 60 updates/sec so speed is the same on 60Hz and 120Hz screens
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc = Math.min(acc + (now - last), 200); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  const alpha = acc / STEP;
  ox = state === 'play' ? move * alpha : 0;
  birdFactor = state === 'play' ? (move + robinDrift()) / move : 1;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Offline: a service worker (sw.js) keeps a copy of the game on the device so it opens
// without signal. Only works from a web address (GitHub Pages or a local server).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
